      confidence: 0.95
      greeting_message: "Frontend live na Vercel! URL: {cliente}-lp.vercel.app"
      next_steps:
        - command: "*deploy-easypanel"
          description: "Anchor deploya backend no EasyPanel (se condicional)"
          priority: 1
          conditional: "backend: true"
        - command: "*setup-domain"
          description: "Anchor configura domÃ­nio customizado (se cliente tiver)"
          priority: 2

    fully_deployed:
      trigger: "All services deployed and accessible"
      confidence: 0.90
      greeting_message: "Deploy completo! Salvando no GitHub do cliente..."
