    # Step 1-2 â€” Extract Reference (condicional: se URL existe)
    - agent: lp-scraper
      action: "extract-design"
      creates: "extracted-design-tokens.md"
      description: "Extrair design system da URL de referÃªncia"
      conditional: "reference_url exists"

    - agent: lp-scraper
