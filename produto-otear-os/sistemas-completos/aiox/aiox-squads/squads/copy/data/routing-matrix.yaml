  frio:
    - "público novo"
    - "nunca ouviu falar"
    - "topo de funil"
    - "cold audience"
    - "prospecção"
  morno:
    - "já conhece"
    - "retargeting"
    - "engajou"
    - "meio de funil"
    - "warm audience"
  quente:
    - "lista engajada"
    - "carrinho abandonado"
    - "fundo de funil"
    - "hot audience"
    - "comprador"
  b2b:
    - "empresa"
    - "B2B"
    - "decisor"
    - "CTO"
    - "CEO"
    - "corporativo"
    - "profissional"
