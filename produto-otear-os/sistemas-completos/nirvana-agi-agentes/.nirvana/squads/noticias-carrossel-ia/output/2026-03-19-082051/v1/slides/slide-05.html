<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1440px; overflow: hidden;
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column;
      position: relative;
    }
    .bg-image {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: url('../images/img-slide-05.png') center/cover no-repeat;
      z-index: 0;
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(15, 15, 26, 0.9) 0%,
        rgba(15, 15, 26, 0.5) 35%,
        rgba(15, 15, 26, 0.5) 65%,
        rgba(15, 15, 26, 0.92) 100%
      );
      z-index: 1;
    }
    .content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      height: 100%; padding: 72px;
      justify-content: space-between;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .handle { font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.5); }
    .main {
      display: flex; flex-direction: column; gap: 40px;
    }
    .headline {
      font-size: 48px; font-weight: 800; color: #FFFFFF;
      line-height: 1.2;
    }
    .revenue-flow {
      display: flex; flex-direction: column; gap: 24px;
    }
    .revenue-item {
      display: flex; align-items: center; gap: 24px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px 40px;
    }
    .revenue-amount {
      font-size: 58px; font-weight: 800; color: #FFD93D;
      white-space: nowrap;
    }
    .revenue-label {
      font-size: 28px; font-weight: 500; color: rgba(255,255,255,0.8);
      line-height: 1.4;
    }
    .arrow-down {
      font-size: 48px; color: #E8734A;
      text-align: center;
    }
    .body-text {
      font-size: 34px; font-weight: 500; color: #C0C0E0;
      line-height: 1.6;
    }
    .body-text .highlight { color: #FFD93D; font-weight: 700; }
    .body-text .accent { color: #E8734A; font-weight: 700; }
    .footer {
      display: flex; justify-content: flex-end; align-items: center; gap: 8px;
    }
    .swipe { font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.4); }
    .swipe-arrow { font-size: 28px; color: #E8734A; }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="header">
      <span class="handle">@marlonlima.ia</span>
    </div>

    <div class="main">
      <h2 class="headline">Receita do Claude Code em 3 meses:</h2>
      <div class="revenue-flow">
        <div class="revenue-item">
          <span class="revenue-amount">$1B</span>
          <span class="revenue-label">Receita anual em 2025</span>
        </div>
        <div class="arrow-down">↓</div>
        <div class="revenue-item">
          <span class="revenue-amount">$2,5B</span>
          <span class="revenue-label">Receita em fev/2026</span>
        </div>
      </div>
      <p class="body-text">A TIME elegeu a Anthropic a <span class="accent">empresa mais disruptiva do mundo</span>. Crescimento de <span class="highlight">150%</span> nasceu da coragem de recusar.</p>
    </div>

    <div class="footer">
      <span class="swipe">Deslize</span>
      <span class="swipe-arrow">→</span>
    </div>
  </div>
</body>
</html>
