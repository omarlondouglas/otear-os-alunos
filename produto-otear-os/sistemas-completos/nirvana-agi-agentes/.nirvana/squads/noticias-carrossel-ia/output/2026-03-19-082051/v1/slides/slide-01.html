<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1440px; overflow: hidden;
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column;
      position: relative;
    }
    .bg-image {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: url('../images/img-slide-01.png') center/cover no-repeat;
      z-index: 0;
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(15, 15, 26, 0.7) 0%,
        rgba(15, 15, 26, 0.4) 40%,
        rgba(15, 15, 26, 0.4) 60%,
        rgba(15, 15, 26, 0.85) 100%
      );
      z-index: 1;
    }
    .content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      height: 100%; padding: 72px;
      justify-content: space-between;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .handle {
      font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
    }
    .date {
      font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.5);
    }
    .hero-section {
      display: flex; flex-direction: column; gap: 32px;
      align-items: flex-start;
    }
    .tag {
      display: inline-block;
      background: #E8734A;
      color: #FFFFFF;
      font-size: 22px; font-weight: 700;
      padding: 10px 24px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .hero {
      font-size: 64px; font-weight: 800; color: #FFFFFF;
      line-height: 1.15;
      max-width: 900px;
    }
    .hero .accent {
      color: #FFD93D;
    }
    .hero .highlight {
      color: #E8734A;
    }
    .footer {
      display: flex; justify-content: flex-end; align-items: center; gap: 8px;
    }
    .swipe {
      font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.6);
    }
    .swipe-arrow {
      font-size: 28px; color: #E8734A;
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="header">
      <span class="handle">@marlonlima.ia</span>
      <span class="date">19 MAR 2026</span>
    </div>

    <div class="hero-section">
      <span class="tag">Caso Real</span>
      <h1 class="hero">
        A empresa que disse <span class="highlight">NÃO</span> e cresceu <span class="accent">150%</span> em 3 meses
      </h1>
    </div>

    <div class="footer">
      <span class="swipe">Deslize</span>
      <span class="swipe-arrow">→</span>
    </div>
  </div>
</body>
</html>
