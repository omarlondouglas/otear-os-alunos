<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px; overflow: hidden;
      background: #0a0a0a;
      font-family: 'Urbanist', sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: #ffffff;
      padding: 56px;
    }
    .header {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 32px 56px;
      font-size: 22px; font-weight: 400; color: #666666;
    }
    .content {
      text-align: center;
      max-width: 850px;
    }
    .cta-headline {
      font-size: 62px; font-weight: 800; line-height: 1.2;
      margin-bottom: 40px;
    }
    .cta-sub {
      font-size: 30px; font-weight: 400; line-height: 1.6;
      color: #888888;
      margin-bottom: 56px;
    }
    .action-pill {
      display: inline-block;
      background: #A3F12E; color: #0a0a0a;
      padding: 20px 48px;
      border-radius: 50px;
      font-size: 28px; font-weight: 700;
      letter-spacing: 0.5px;
    }
    .handle-bottom {
      position: absolute; bottom: 48px;
      font-size: 26px; font-weight: 500; color: #666666;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>Powered by Tear CRM</span>
    <span>@marlonlima.ia</span>
    <span>2026 //</span>
  </div>

  <div class="content">
    <div class="cta-headline">
      Qual cliente ou projeto você deveria ter recusado?
    </div>
    <div class="cta-sub">
      Comenta aqui embaixo. A resposta pode revelar mais sobre o posicionamento da sua agência do que qualquer briefing.
    </div>
    <div class="action-pill">💬 COMENTA AQUI</div>
  </div>

  <div class="handle-bottom">@marlonlima.ia</div>
</body>
</html>
