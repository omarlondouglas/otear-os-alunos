<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1440px; overflow: hidden;
      background: #0F0F1A;
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column;
    }
    .header {
      display: flex; justify-content: flex-end;
      padding: 48px 72px 0;
    }
    .handle { font-size: 26px; font-weight: 600; color: #A0A0C0; letter-spacing: 0.02em; }
    .image-zone {
      width: 100%; height: 580px; overflow: hidden; position: relative;
    }
    .image-zone img {
      width: 100%; height: 100%; object-fit: cover; object-position: center;
    }
    .image-overlay {
      position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
      background: linear-gradient(to bottom, transparent, #0F0F1A);
    }
    .content {
      flex: 1; padding: 36px 72px 64px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .overline {
      font-size: 22px; font-weight: 700; color: #FFD93D;
      text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 24px;
    }
    .headline {
      font-size: 50px; font-weight: 900; color: #FFFFFF; line-height: 1.15; margin-bottom: 32px;
    }
    .highlight { color: #25D366; }
    .body-text {
      font-size: 30px; font-weight: 500; color: #A0A0C0; line-height: 1.6;
    }
    .body-text strong { color: #FFFFFF; font-weight: 700; }
    .cta-pill {
      display: inline-flex; align-items: center; gap: 12px;
      background: rgba(108,99,255,0.15);
      border: 1px solid #6C63FF;
      border-radius: 16px;
      padding: 18px 28px;
      margin-top: 32px;
      font-size: 26px; font-weight: 700; color: #6C63FF;
    }
  </style>
</head>
<body>
  <div class="header"><span class="handle">@marlonlima.ia</span></div>
  <div class="image-zone">
    <img src="../images/img-slide-06.png" alt="Smartphone CRM WhatsApp">
    <div class="image-overlay"></div>
  </div>
  <div class="content">
    <div class="overline">Como começar</div>
    <h2 class="headline">
      Você não precisa de equipe.<br>Precisa de um agente<br><span class="highlight">conectado ao seu WhatsApp.</span>
    </h2>
    <p class="body-text">
      Configure uma vez.<br>
      <strong>O agente opera 24/7</strong> — qualificando leads,<br>
      respondendo dúvidas, passando<br>só os prontos pra você.
    </p>
    <div class="cta-pill">
      💡 Tear CRM integra IA ao WhatsApp
    </div>
  </div>
</body>
</html>
