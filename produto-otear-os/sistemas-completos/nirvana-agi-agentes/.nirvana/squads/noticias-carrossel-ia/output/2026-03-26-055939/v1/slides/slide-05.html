<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1440px; overflow: hidden;
      font-family: 'Urbanist', sans-serif;
      position: relative;
    }

    /* ---- Themes (BrandsDecoded) ---- */
    body.theme-dark   { background: #0a0a0a; color: #FFFFFF; }
    body.theme-light  { background: #F5F5F0; color: #0a0a0a; }
    body.theme-accent { background: #A3F12E; color: #0a0a0a; }
    body.theme-black  { background: #000000; color: #FFFFFF; }

    /* ---- Image Layer ---- */
    .img-layer {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
    }
    .img-layer::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.82) 100%);
    }
    body.no-overlay .img-layer::after { display: none; }

    /* ---- Content ---- */
    .content {
      position: relative; z-index: 2;
      width: 100%; height: 100%;
      padding: 72px;
      display: flex; flex-direction: column;
    }

    /* ---- Header bar (todos os slides) ---- */
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 22px; font-weight: 500;
      letter-spacing: 0.01em;
      margin-bottom: 64px;
      flex-shrink: 0;
    }
    body.theme-dark .header-bar,
    body.theme-black .header-bar { color: rgba(255,255,255,0.4); }
    body.theme-light .header-bar  { color: rgba(0,0,0,0.4); }
    body.theme-accent .header-bar { color: rgba(0,0,0,0.5); }

    /* ---- Tag / Label ---- */
    .tag {
      display: inline-block;
      font-size: 22px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 10px 22px; border-radius: 8px;
      background: #A3F12E; color: #0a0a0a;
      margin-bottom: 40px; align-self: flex-start;
      flex-shrink: 0;
    }
    body.theme-accent .tag { background: #0a0a0a; color: #A3F12E; }
    body.theme-light  .tag { background: #0a0a0a; color: #F5F5F0; }

    /* ---- Number / Stat ---- */
    .stat {
      font-size: 160px; font-weight: 800;
      line-height: 0.88; letter-spacing: -0.05em;
      color: #A3F12E;
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    body.theme-accent .stat { color: #0a0a0a; }
    body.theme-light  .stat { color: #0a0a0a; }

    /* ---- Headline ---- */
    .headline {
      font-size: 72px; font-weight: 800;
      line-height: 1.05; letter-spacing: -0.03em;
      margin-bottom: 36px;
      flex-shrink: 0;
    }
    /* <em> = marcador verde (highlight effect da BrandsDecoded) */
    .headline em {
      font-style: normal;
      background: #A3F12E; color: #0a0a0a;
      padding: 0 8px 4px;
    }
    .headline strong { font-weight: 900; }
    body.theme-accent .headline em { background: #0a0a0a; color: #A3F12E; }
    body.theme-light  .headline em { background: #A3F12E; color: #0a0a0a; }

    /* ---- Subheadline ---- */
    .sub {
      font-size: 44px; font-weight: 600;
      line-height: 1.2; letter-spacing: -0.02em;
      margin-bottom: 28px;
      opacity: 0.75;
      flex-shrink: 0;
    }

    /* ---- Body ---- */
    .body-text {
      font-size: 34px; font-weight: 500;
      line-height: 1.55; letter-spacing: -0.01em;
      opacity: 0.75;
      flex: 1;
    }
    .body-text strong { font-weight: 800; opacity: 1; }
    .body-text em {
      font-style: normal;
      background: #A3F12E; color: #0a0a0a;
      padding: 0 6px 2px;
    }
    body.theme-accent .body-text em { background: #0a0a0a; color: #A3F12E; }
    body.theme-light  .body-text em { background: #A3F12E; color: #0a0a0a; }

    /* ---- List ---- */
    .list {
      list-style: none;
      display: flex; flex-direction: column; gap: 24px;
      flex: 1;
    }
    .list li {
      font-size: 34px; font-weight: 500; line-height: 1.3;
      display: flex; gap: 20px; align-items: flex-start;
    }
    .list li::before {
      content: '→';
      color: #A3F12E; font-weight: 800; flex-shrink: 0;
    }
    body.theme-accent .list li::before { color: #0a0a0a; }
    body.theme-light  .list li::before { color: #0a0a0a; }

    /* ---- CTA Box ---- */
    .cta-box {
      background: rgba(163,241,46,0.1);
      border: 2px solid #A3F12E;
      border-radius: 20px;
      padding: 44px 52px;
      font-size: 38px; font-weight: 700;
      line-height: 1.3; letter-spacing: -0.01em;
      text-align: center;
      flex-shrink: 0;
    }
    body.theme-accent .cta-box {
      background: rgba(0,0,0,0.12);
      border-color: rgba(0,0,0,0.5);
    }
    body.theme-light .cta-box {
      background: rgba(0,0,0,0.06);
      border-color: #0a0a0a;
    }

    /* ---- Swipe hint ---- */
    .swipe {
      font-size: 26px; font-weight: 600;
      opacity: 0.35; text-align: center;
      margin-top: 36px; letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .swipe::after { content: ' →'; }

    /* ---- Spacer ---- */
    .spacer { flex: 1; min-height: 24px; }
  </style>
</head>
