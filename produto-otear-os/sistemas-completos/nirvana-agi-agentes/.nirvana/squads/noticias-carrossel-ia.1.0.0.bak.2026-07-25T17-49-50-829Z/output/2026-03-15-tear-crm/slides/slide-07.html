<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1440px; overflow: hidden;
      background: #0a0a0a;
      font-family: 'Urbanist', sans-serif;
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 96px 80px;
      position: relative;
    }
    .handle {
      position: absolute;
      top: 52px; right: 72px;
      font-size: 24px; font-weight: 500; color: #888888;
    }
    .label {
      font-size: 22px; font-weight: 700; color: #A3F12E;
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .headline {
      font-size: 54px; font-weight: 800; color: #ffffff;
      line-height: 1.15; letter-spacing: -0.5px;
      margin-bottom: 48px; max-width: 920px;
    }
    .steps { display: flex; flex-direction: column; gap: 20px; margin-bottom: 52px; }
    .step {
      display: flex; align-items: center; gap: 28px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px 32px;
    }
    .step-num {
      width: 52px; height: 52px; flex-shrink: 0;
      background: #A3F12E;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: #0a0a0a;
    }
    .step-text {
      font-size: 32px; font-weight: 500; color: #cccccc;
      line-height: 1.3;
    }
    .cta {
      background: #A3F12E;
      border-radius: 20px;
      padding: 40px 48px;
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
    }
    .cta-main {
      font-size: 48px; font-weight: 800; color: #0a0a0a;
      letter-spacing: -0.5px;
    }
    .cta-sub {
      font-size: 28px; font-weight: 500; color: rgba(10,10,10,0.65);
    }
  </style>
</head>
<body>
  <span class="handle">@marlonlima.ia</span>
  <div class="label">Começa agora</div>
  <h2 class="headline">Chega de CRM que ninguém usa.</h2>
  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <span class="step-text">Acessa otear.com.br</span>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <span class="step-text">Conecta seu WhatsApp em 2 minutos</span>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <span class="step-text">Deixa o Tear trabalhar por você</span>
    </div>
  </div>
  <div class="cta">
    <span class="cta-main">Comenta EU QUERO</span>
    <span class="cta-sub">Te mando o link direto</span>
  </div>
</body>
</html>
