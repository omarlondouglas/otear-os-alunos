<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1440px; overflow: hidden;
      background: #0a0a0a;
      font-family: 'Urbanist', sans-serif;
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 96px 80px;
      position: relative;
    }
    .handle {
      position: absolute;
      top: 52px; right: 72px;
      font-size: 24px; font-weight: 500; color: #888888;
    }
    .label {
      font-size: 22px; font-weight: 700; color: #A3F12E;
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .headline {
      font-size: 54px; font-weight: 800; color: #ffffff;
      line-height: 1.15; letter-spacing: -0.5px;
      margin-bottom: 48px; max-width: 920px;
    }
    .items { display: flex; flex-direction: column; gap: 20px; }
    .item {
      display: flex; align-items: center; gap: 28px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px 32px;
    }
    .item-num {
      width: 52px; height: 52px; flex-shrink: 0;
      background: #A3F12E;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: #0a0a0a;
    }
    .item-text {
      font-size: 32px; font-weight: 500; color: #cccccc;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <span class="handle">@marlonlima.ia</span>
  <div class="label">Simples assim</div>
  <h2 class="headline">Como funciona na prática:</h2>
  <div class="items">
    <div class="item">
      <div class="item-num">1</div>
      <span class="item-text">Conecta seu WhatsApp ao Tear</span>
    </div>
    <div class="item">
      <div class="item-num">2</div>
      <span class="item-text">Conversa com seus clientes normalmente</span>
    </div>
    <div class="item">
      <div class="item-num">3</div>
      <span class="item-text">O Tear analisa e organiza tudo sozinho</span>
    </div>
    <div class="item">
      <div class="item-num">4</div>
      <span class="item-text">Você recebe alertas e insights pra fechar mais</span>
    </div>
  </div>
</body>
</html>
