<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px; overflow: hidden;
      font-family: 'Urbanist', sans-serif;
      position: relative;
      color: #ffffff;
    }
    .bg-image {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: url('http://localhost:8765/images/img-slide-01-v3.png') center center / cover no-repeat;
      z-index: 1;
    }
    .bg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(10,10,10,0.3) 0%,
        rgba(10,10,10,0.1) 30%,
        rgba(10,10,10,0.4) 55%,
        rgba(10,10,10,0.92) 75%,
        rgba(10,10,10,0.98) 100%
      );
      z-index: 2;
    }
    .content {
      position: relative; z-index: 3;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 28px 56px;
      font-size: 22px; font-weight: 400; color: rgba(255,255,255,0.5);
    }
    .spacer { flex: 1; }
    .bottom-content {
      padding: 0 56px 48px;
    }
    .handle {
      font-size: 24px; font-weight: 500; color: #A3F12E;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .handle .dot { width: 10px; height: 10px; border-radius: 50%; background: #A3F12E; }
    .title {
      font-size: 62px; font-weight: 800; line-height: 1.12;
      margin-bottom: 20px;
    }
    .title .highlight {
      background: #A3F12E; color: #0a0a0a;
      padding: 2px 12px; border-radius: 6px;
    }
    .subtitle {
      font-size: 28px; font-weight: 400; color: rgba(255,255,255,0.6);
      line-height: 1.5;
    }
    .dots {
      display: flex; gap: 10px; padding: 24px 0 0;
    }
    .dot-nav { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.25); }
    .dot-nav.active { background: #A3F12E; }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="content">
    <div class="header">
      <span>Powered by Tear CRM</span>
      <span>@marlonlima.ia</span>
      <span>2026 //</span>
    </div>
    <div class="spacer"></div>
    <div class="bottom-content">
      <div class="handle"><div class="dot"></div> @marlonlima.ia</div>
      <div class="title">
        A Anthropic disse <span class="highlight">não</span> ao Pentágono e o Claude virou o app mais baixado do mundo.
      </div>
      <div class="subtitle">Quando recusar o maior cliente do planeta vira a melhor estratégia de marketing.</div>
      <div class="dots">
        <div class="dot-nav active"></div>
        <div class="dot-nav"></div><div class="dot-nav"></div><div class="dot-nav"></div>
        <div class="dot-nav"></div><div class="dot-nav"></div><div class="dot-nav"></div><div class="dot-nav"></div>
      </div>
    </div>
  </div>
</body>
</html>
