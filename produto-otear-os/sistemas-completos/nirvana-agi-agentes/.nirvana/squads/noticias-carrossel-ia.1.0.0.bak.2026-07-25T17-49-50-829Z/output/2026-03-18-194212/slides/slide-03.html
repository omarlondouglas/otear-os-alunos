<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1440px; overflow: hidden;
      background: #0F0F1A;
      font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: flex-end;
      padding: 48px 72px 0;
    }
    .handle {
      font-size: 26px; font-weight: 600; color: #A0A0C0; letter-spacing: 0.02em;
    }
    .image-zone {
      width: 100%; height: 560px; overflow: hidden; position: relative;
    }
    .image-zone img {
      width: 100%; height: 100%; object-fit: cover; object-position: center;
    }
    .image-overlay {
      position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
      background: linear-gradient(to bottom, transparent, #0F0F1A);
    }
    .content {
      flex: 1; padding: 40px 72px 64px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .tag {
      display: inline-block;
      background: rgba(108,99,255,0.2);
      border: 1px solid #6C63FF;
      color: #6C63FF;
      font-size: 22px; font-weight: 700;
      padding: 10px 24px; border-radius: 100px;
      margin-bottom: 28px; width: fit-content;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .headline {
      font-size: 52px; font-weight: 900; color: #FFFFFF; line-height: 1.15; margin-bottom: 32px;
    }
    .headline .highlight { color: #FFD93D; }
    .body-text {
      font-size: 31px; font-weight: 500; color: #A0A0C0; line-height: 1.6;
    }
    .body-text strong { color: #FFFFFF; font-weight: 700; }
  </style>
</head>
<body>
  <div class="header"><span class="handle">@marlonlima.ia</span></div>

  <div class="image-zone">
    <img src="../images/img-slide-03.png" alt="Notificações acumuladas">
    <div class="image-overlay"></div>
  </div>

  <div class="content">
    <div class="tag">O problema</div>
    <h2 class="headline">
      Nenhum humano consegue<br>responder em <span class="highlight">5 min</span><br>o tempo todo.
    </h2>
    <p class="body-text">
      Você está em reunião. Criando conteúdo.<br>
      Atendendo outro cliente.<br><br>
      Não é falta de esforço.<br>
      <strong>É falta de escala.</strong>
    </p>
  </div>
</body>
</html>
