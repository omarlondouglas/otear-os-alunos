    Pesquisa um tema de aula, estrutura o conteúdo didático,
    cria slides HTML/CSS em 1920x1080 (widescreen) e gera
    uma apresentação completa pronta para projetar.
  icon: 🎓
  version: "1.0.0"
  author: Marlon Lima
  created: "2026-03-20"

skills:
