  - web_fetch

pipeline:
  steps:
    - checkpoint-tema
    - pesquisador
    - estrategista
    - redator
    - designer
    - checkpoint-imagens
    - curador-imagens
    - conceituador-visual
    - gerador-imagens
    - image-patcher
    - revisor
    - checkpoint-final
