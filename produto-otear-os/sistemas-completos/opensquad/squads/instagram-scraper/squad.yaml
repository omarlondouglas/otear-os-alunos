squad:
  code: instagram-scraper
  name: "Instagram Carousel Scraper"
  description: >
    Entra no Instagram com sessão persistente (Playwright), navega até um perfil,
    identifica os carrosséis mais recentes e baixa todas as imagens dos slides.
    Salva as imagens organizadas por post na pasta output.
  icon: 📸
  version: "1.0.0"
  author: Marlon Lima
  created: "2026-03-14"

skills: []

pipeline:
  steps:
    - checkpoint-perfil
    - scraper
