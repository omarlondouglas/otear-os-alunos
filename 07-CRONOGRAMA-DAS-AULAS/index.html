<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otear OS — Cronograma das Aulas</title>
<meta name="description" content="Apresentação interativa das 12 aulas práticas do Otear OS.">
<style>
:root{--navy:#07111f;--card:#0e1b2d;--line:rgba(255,255,255,.12);--ink:#f8fafc;--muted:#9fb0c6;--cyan:#38bdf8;--blue:#2563eb;--violet:#a78bfa;--green:#22c55e;--shadow:0 28px 80px rgba(0,0,0,.42)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--navy);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.ambient{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 15%,rgba(37,99,235,.25),transparent 32%),radial-gradient(circle at 12% 85%,rgba(167,139,250,.16),transparent 33%)}.grid{position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px}.topbar{position:fixed;z-index:20;left:0;right:0;top:0;height:70px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(7,17,31,.95),rgba(7,17,31,.42),transparent);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.12em}.logo{width:36px;height:36px;border:1px solid rgba(56,189,248,.55);border-radius:11px;display:grid;place-items:center;background:rgba(56,189,248,.1);box-shadow:inset 0 0 18px rgba(56,189,248,.14)}.logo:before{content:"";width:15px;height:15px;border-radius:50%;border:4px solid var(--cyan);box-shadow:0 0 20px var(--cyan)}.meta{color:var(--muted);font-size:13px}.deck{height:100vh;display:flex;transition:transform .75s cubic-bezier(.2,.8,.2,1)}.slide{height:100vh;min-width:100vw;padding:105px 7vw 90px;display:grid;grid-template-columns:minmax(0,1.22fr) minmax(340px,.78fr);gap:5vw;align-items:center;position:relative}.slide.cover{grid-template-columns:1fr}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase;margin-bottom:18px}.number{font-size:clamp(74px,10vw,160px);font-weight:950;line-height:.78;letter-spacing:-.075em;color:transparent;-webkit-text-stroke:1px rgba(56,189,248,.38);position:absolute;right:6vw;top:15vh;opacity:.72;user-select:none}.title{font-size:clamp(38px,5.2vw,78px);line-height:.96;letter-spacing:-.055em;margin:0;max-width:980px}.cover .title{font-size:clamp(55px,8.4vw,128px);max-width:1150px}.gradient{background:linear-gradient(92deg,#fff 4%,#88dcff 54%,#bda8ff 100%);-webkit-background-clip:text;color:transparent}.lead{font-size:clamp(17px,1.65vw,24px);line-height:1.55;color:var(--muted);max-width:820px;margin:24px 0 0}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}.chip{border:1px solid var(--line);background:rgba(255,255,255,.045);padding:9px 12px;border-radius:999px;color:#dbeafe;font-size:13px;font-weight:750}.panel{border:1px solid var(--line);border-radius:24px;background:linear-gradient(155deg,rgba(255,255,255,.095),rgba(255,255,255,.025));box-shadow:var(--shadow);padding:26px;position:relative;overflow:hidden}.panel:after{content:"";position:absolute;width:170px;height:170px;background:var(--blue);filter:blur(85px);opacity:.18;right:-70px;top:-60px}.panel h3{margin:0 0 16px;font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--cyan)}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:27px 1fr;gap:11px;align-items:start;color:#dce7f5;font-size:15px;line-height:1.42}.tick{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:rgba(56,189,248,.11);border:1px solid rgba(56,189,248,.28);color:var(--cyan);font-weight:900}.prompt{margin-top:20px;border-radius:16px;padding:16px;background:#06101c;border:1px solid rgba(56,189,248,.24);color:#bdeaff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55}.result{margin-top:16px;border-left:3px solid var(--violet);padding:10px 0 10px 14px;color:#d6ccff;font-size:14px;line-height:1.48}.footer{position:fixed;z-index:30;left:5vw;right:5vw;bottom:22px;display:flex;align-items:center;justify-content:space-between}.controls{display:flex;gap:8px}.btn{border:1px solid var(--line);background:rgba(13,28,47,.72);color:#fff;width:46px;height:42px;border-radius:13px;display:grid;place-items:center;cursor:pointer;font-size:20px;backdrop-filter:blur(12px);transition:.2s}.btn:hover{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.4);transform:translateY(-2px)}.progress-shell{width:min(520px,42vw);height:4px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .65s ease}.counter{font-size:12px;color:var(--muted);min-width:58px;text-align:right}.hint{position:fixed;right:5vw;top:76px;color:#75869e;font-size:12px}.appear{opacity:0;transform:translateY(22px);transition:all .75s .2s}.active .appear{opacity:1;transform:none}.active .appear.delay{transition-delay:.38s}@media(max-width:900px){body{overflow:auto}.deck{height:auto;display:block;transform:none!important}.slide{min-height:100vh;height:auto;min-width:0;padding:100px 6vw 80px;grid-template-columns:1fr}.footer,.hint{display:none}.number{top:95px;right:5vw;font-size:90px}.panel{margin-top:10px}.topbar{padding:0 6vw}.meta{display:none}}
</style>
</head>
<body>
<div class="ambient"></div><div class="grid"></div>
<header class="topbar"><div class="brand"><span class="logo"></span> OTEAR OS</div><div class="meta">FORMAÇÃO EMPRESA SEM ESFORÇO • AULAS PRÁTICAS</div></header>
<div class="hint">Use ← → ou espaço para navegar</div>
<main class="deck" id="deck"></main>
<footer class="footer"><div class="controls"><button class="btn" id="prev" aria-label="Anterior">←</button><button class="btn" id="next" aria-label="Próximo">→</button></div><div class="progress-shell"><div class="progress" id="progress"></div></div><div class="counter" id="counter"></div></footer>
<script>
const lessons=[
{n:"01",m:"Módulo 1 • Setup & Primeiro Resultado",t:"Visão Geral do Otear OS",d:"6 min",l:"Entenda como agentes, skills, squads e workflows transformam pedidos simples em entregas completas.",items:["Baixar a pasta oficial otear-os-alunos","Instalar o Obsidian","Abrir SOUL.md e o Mapa do Otear OS"],p:"Ative o Otear OS, leia SOUL.md e escolha a melhor rota para meu pedido.",r:"Saída: o aluno entende a arquitetura e sabe onde cada peça entra."},
{n:"02",m:"Módulo 1 • Setup & Primeiro Resultado",t:"O Que Baixar e Instalar",d:"5 min",l:"Setup rápido, sem terminal obrigatório e sem complicação técnica.",items:["Obsidian: obsidian.md","GitHub Desktop: opcional","Abrir a pasta como Vault e testar Ctrl/Cmd + G"],p:"Abra MAPA DO OTEAR OS.md e use os links para explorar agentes e squads.",r:"Saída: ambiente local pronto e mapa visual funcionando."},
{n:"03",m:"Módulo 1 • Setup & Primeiro Resultado",t:"Primeiro Resultado em 3 Minutos",d:"7 min",l:"Conecte o Hermes à vault e gere uma entrega real para seu próprio negócio.",items:["Selecionar a pasta otear-os-alunos","Enviar o bootstrap","Informar empresa, oferta e público"],p:"Ative o Modo Leigo. Minha empresa é [X]. Quero 3 ângulos de conteúdo para [público].",r:"Saída: primeira entrega útil salva na pasta do aluno."},
{n:"04",m:"Módulo 2 • Agentes & Modo Leigo",t:"Modo Leigo & Orquestrador",d:"6 min",l:"Converse naturalmente. O sistema interpreta o objetivo e escolhe os especialistas nos bastidores.",items:["Usar /otear ou “Use o Otear OS”","Descrever o resultado desejado","Aprovar a rota sugerida"],p:"/otear Quero reativar clientes antigos que não compram há 6 meses.",r:"Saída: diagnóstico, oferta e mensagem de WhatsApp organizados em etapas."},
{n:"05",m:"Módulo 2 • Agentes & Modo Leigo",t:"Os 35 Agentes Especialistas",d:"8 min",l:"Conheça o time de Pesquisa, Copy, Design, Sites, Tráfego e Comercial.",items:["Abrir agentes-base/","Testar estrategista-de-oferta","Testar copywriter-otear"],p:"Ative o estrategista-de-oferta e transforme meu produto de R$ 500 em uma oferta premium.",r:"Saída: oferta com promessa, mecanismo, bônus e redução de risco."},
{n:"06",m:"Módulo 2 • Agentes & Modo Leigo",t:"Squads em Ação",d:"8 min",l:"Acione times multidisciplinares em uma linha: estratégia, criação, refinamento e qualidade.",items:["Abrir squads-base/","Escolher o squad da demanda","Executar com dados reais"],p:"Ative o squad-campanha-completa para um software de gestão de clínicas.",r:"Saída: pesquisa, oferta, anúncios e estrutura de landing page."},
{n:"07",m:"Módulo 3 • Casos Reais",t:"Prospecção B2B & WhatsApp",d:"9 min",l:"Defina ICP, encontre empresas e crie abordagens personalizadas que parecem humanas.",items:["Escolher um nicho e uma cidade","Rodar squad-prospeccao","Enviar para 5 leads e medir respostas"],p:"Crie ICP, primeira mensagem e 2 follow-ups para arquitetos de alto padrão em Curitiba.",r:"Saída: roteiro de prospecção pronto para executar hoje."},
{n:"08",m:"Módulo 3 • Casos Reais",t:"Conteúdo & Carrosséis",d:"9 min",l:"Transforme uma ideia em carrossel de 7 slides com copy, direção visual e legenda.",items:["Definir um tema reflexivo","Ativar squad-carrossel-avancado","Montar no Canva e publicar"],p:"Crie 7 slides sobre por que trabalhar 14 horas não salva uma empresa.",r:"Saída: carrossel, legenda, CTA e prompt de imagem."},
{n:"09",m:"Módulo 3 • Casos Reais",t:"Landing Pages & Sites",d:"10 min",l:"Gere uma página de vendas responsiva em HTML, pronta para testar no navegador.",items:["Definir oferta e público","Ativar squad-site","Salvar como index.html"],p:"Crie uma landing page dark e responsiva para a Mentoria Empresa Sem Esforço.",r:"Saída: HTML com hero, prova, oferta, FAQ e CTA."},
{n:"10",m:"Módulo 3 • Casos Reais",t:"Tráfego Pago & Copy",d:"8 min",l:"Crie campanhas com níveis de consciência e frameworks de Halbert, Schwartz e Kennedy.",items:["Definir nível de consciência","Gerar 3 ângulos","Subir e medir CTR/CPA"],p:"Crie 3 anúncios para consultoria de automação: história, quebra de mito e oferta direta.",r:"Saída: texto principal, título, descrição, CTA e segmentação."},
{n:"11",m:"Módulo 4 • Personalização & B2B",t:"Crie Seus Agentes e Squads",d:"7 min",l:"Construa especialistas sob medida usando papel, objetivo, regras e exemplo de saída.",items:["Escolher uma tarefa repetitiva","Usar os templates","Salvar em meus-agentes/ e testar"],p:"Crie o agente auditor-tributario-restaurantes no padrão Otear OS.",r:"Saída: novo agente reutilizável, validado em um caso prático."},
{n:"12",m:"Módulo 4 • Personalização & B2B",t:"Venda Implementações de R$ 3k a 5k+",d:"10 min",l:"Empacote setup, personalização e acompanhamento em uma oferta comercial B2B.",items:["Setup: R$ 3 mil a R$ 5 mil","MRR: R$ 1,5 mil a R$ 2,5 mil","Proposta, cronograma e contrato"],p:"Gere uma proposta executiva de R$ 4.500 para implementar IA numa imobiliária.",r:"Saída: oferta pronta para apresentar a três potenciais clientes."}
];
const deck=document.getElementById('deck');
const cover=`<section class="slide cover active"><div><div class="eyebrow appear">Cronograma oficial • 4 módulos</div><h1 class="title appear delay"><span class="gradient">12 aulas curtas.</span><br>Da instalação à venda.</h1><p class="lead appear delay">93 minutos de conteúdo direto, sempre com o que baixar, demonstração aplicada, prompt pronto e checklist de execução.</p><div class="chips appear delay"><span class="chip">35 agentes</span><span class="chip">19 squads</span><span class="chip">12 aplicações</span><span class="chip">1 resultado por aula</span></div></div></section>`;
const slides=lessons.map(x=>`<section class="slide"><div class="number">${x.n}</div><div><div class="eyebrow appear">${x.m} • ${x.d}</div><h2 class="title appear delay">${x.t}</h2><p class="lead appear delay">${x.l}</p><div class="chips appear delay"><span class="chip">Objetiva</span><span class="chip">Aplicável</span><span class="chip">Prompt pronto</span></div></div><aside class="panel appear delay"><h3>O que fazer nesta aula</h3><div class="list">${x.items.map((i,k)=>`<div class="item"><span class="tick">${k+1}</span><span>${i}</span></div>`).join('')}</div><div class="prompt">${x.p}</div><div class="result">${x.r}</div></aside></section>`).join('');
const end=`<section class="slide cover"><div><div class="eyebrow appear">Próximo passo</div><h2 class="title appear delay"><span class="gradient">Aprendeu?</span><br>Agora implemente.</h2><p class="lead appear delay">O aluno só conclui uma aula quando usa o prompt no próprio negócio e salva uma entrega real.</p><div class="chips appear delay"><span class="chip">Assistir</span><span class="chip">Executar</span><span class="chip">Revisar</span><span class="chip">Salvar</span></div></div></section>`;
deck.innerHTML=cover+slides+end;
const all=[...document.querySelectorAll('.slide')];let current=0;
function render(){deck.style.transform=`translateX(-${current*100}vw)`;all.forEach((s,i)=>s.classList.toggle('active',i===current));document.getElementById('progress').style.width=`${((current+1)/all.length)*100}%`;document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${String(all.length).padStart(2,'0')}`;}
function move(v){current=Math.max(0,Math.min(all.length-1,current+v));render()}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key==='Home'){current=0;render()}if(e.key==='End'){current=all.length-1;render()}});render();
</script>
</body>
</html>
